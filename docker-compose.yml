services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clube
      POSTGRES_PASSWORD: clube
      POSTGRES_DB: clube
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clube -d clube"]
      interval: 5s
      timeout: 5s
      retries: 10
