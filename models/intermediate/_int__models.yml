models:
  - name: int_transactions
    description: >
      Movimentação enriquecida com o cliente e com o sinal da operação.
      Uma linha por transaction_id. BUY soma e SELL subtrai, em quantidade
      e em valor financeiro.
    columns:
      - name: transaction_id
        description: Identificador da movimentação. Chave da linha.
        data_tests:
          - unique
          - not_null
      - name: client_id
        description: Cliente da movimentação. Só entra quem existe em stg_clients.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: client_name
        description: Nome do cliente no momento da transformação.
        data_tests:
          - not_null
      - name: asset_ticker
        description: Ticker do ativo.
        data_tests:
          - not_null
      - name: operation
        description: BUY ou SELL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: quantity
        description: Quantidade negociada, sempre positiva.
        data_tests:
          - not_null
      - name: unit_price
        description: Preço unitário da movimentação.
        data_tests:
          - not_null
      - name: gross_amount
        description: Valor financeiro absoluto, quantity multiplicado por unit_price.
        data_tests:
          - not_null
      - name: signed_quantity
        description: Quantidade com sinal. Positiva em BUY e negativa em SELL.
        data_tests:
          - not_null
      - name: signed_amount
        description: Valor financeiro com sinal. Positivo em BUY e negativo em SELL.
        data_tests:
          - not_null
      - name: transaction_date
        description: Data da movimentação.
        data_tests:
          - not_null

unit_tests:
  - name: test_int_transactions_signs_buy_and_sell
    description: BUY entra positivo e SELL entra negativo, em quantidade e em valor.
    model: int_transactions
    given:
      - input: ref('stg_transactions')
        rows:
          - {
              transaction_id: T1,
              client_id: C1,
              asset_ticker: PETR4,
              operation: BUY,
              quantity: 10,
              unit_price: 2,
              transaction_date: "2024-01-01"
            }
          - {
              transaction_id: T2,
              client_id: C1,
              asset_ticker: PETR4,
              operation: SELL,
              quantity: 4,
              unit_price: 3,
              transaction_date: "2024-01-02"
            }
      - input: ref('stg_clients')
        rows:
          - {
              client_id: C1,
              client_name: ANA SOUZA,
              city: SAO PAULO,
              state: SP,
              client_created_at: "2023-01-10"
            }
    expect:
      rows:
        - {transaction_id: T1, signed_quantity: "10.0000", signed_amount: "20.0000", gross_amount: "20.0000"}
        - {transaction_id: T2, signed_quantity: "-4.0000", signed_amount: "-12.0000", gross_amount: "12.0000"}
