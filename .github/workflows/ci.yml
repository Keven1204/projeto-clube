name: dbt

on:
  push:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clube
          POSTGRES_PASSWORD: clube
          POSTGRES_DB: clube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clube -d clube"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_PROFILES_DIR: .
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: clube
      DBT_PASSWORD: clube
      DBT_DBNAME: clube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: dbt seed
        run: dbt seed
      - name: dbt run
        run: dbt run
      - name: dbt test
        run: dbt test
      - name: sqlfluff
        run: sqlfluff lint models macros tests
